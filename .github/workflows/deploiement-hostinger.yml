# Déploiement automatique vers Hostinger à chaque push.
# Prérequis (une seule fois) : dans GitHub → Settings → Secrets and variables →
# Actions, créer :
#   HOSTINGER_FTP_SERVER    (ex. ftp://145.14.x.x ou le domaine FTP du hPanel)
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD
# Sans ces secrets, le workflow vérifie seulement que le build passe.

name: Déploiement Hostinger

on:
  push:
    branches: [claude/website-maintenance-redesign-x78nl2, main]
  workflow_dispatch:

env:
  FTP_PRET: ${{ secrets.HOSTINGER_FTP_SERVER != '' }}

jobs:
  construire-et-deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer et construire
        run: |
          npm ci
          npm run build

      - name: Déployer vers public_html (FTPS)
        if: env.FTP_PRET == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: public_html/

      - name: Secrets FTP absents
        if: env.FTP_PRET != 'true'
        run: echo "Build vérifié. Déploiement sauté (secrets HOSTINGER_FTP_* non configurés)."
